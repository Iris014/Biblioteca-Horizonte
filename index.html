<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Horizonte</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header class="nav">
        <div class="c-nav">
            <h1 class="B-Horizonte">
                <img src="static/images/" alt="logo" class="logo">Biblioteca <span class="horizonte">Horizonte</span>
            </h1>
        </div>
        <div class="c-nav">
            <div class="busqueda">
                <input type="text" id="barra-busqueda" name="email" placeholder="Email">
                <button class="login">Ingresar</button>
            </div>
            <div class="libros">
                <img src="static/images/" alt="Libros seleccionados" class="img-libros">
                <p class="n-libros">0</p>
            </div>
        </div>
    </header>
    <script src="static/js/script.js"></script>
</body>
</html>
